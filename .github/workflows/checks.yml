name: Installer checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n deploy.sh && bash -n deploy-mtproto.sh
      - run: python -m unittest discover -s tests -v
